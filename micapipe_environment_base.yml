name: micapipe-base
channels:
  - conda-forge
dependencies:
  # Python
  - python=3.9
  
  # Core scientific stack
  - numpy=1.21.5
  - scipy
  - pandas=1.4.4
  - matplotlib=3.4.3
  - nibabel=4.0.2
  - pillow
  - packaging
  - scikit-learn
  - scikit-fmm
  - joblib
  - nilearn
  - astropy
  
  # Web and networking
  - aiohttp
  - requests
  - lxml
  - attrs
  - click
  - pyyaml
  - python-dateutil
  - pytz
  - cryptography
  
  # Pip packages
  - pip
  - pip:
    - bokeh==2.2.3
    - pyvirtualdisplay==3.0
    - vtk==9.2.2
    - argparse==1.1
    - brainspace==0.1.10
    - tedana==0.0.12
    - duecredit
    - pyhanko==0.17.2
    - mapca==0.0.3
    - xhtml2pdf==0.2.9
    - oscrypto==1.3.0
    - tzdata==2022.7
    - arabic-reshaper==3.0.0
    - cssselect2==0.7.0
    - pygeodesic==0.1.8
    - seaborn==0.11.2
