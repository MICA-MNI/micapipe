name: Build & Test (server)

# The heavy job: build the comprehensive base + main Docker images,
# convert to Singularity, and run sample_test on the BIC self-hosted
# runner. Gated so it does not run on every push — we only want this
# triggered intentionally:
#   - on PR comment "/build" (via label `ci:build`)
#   - manual dispatch
#   - merge to master (sanity check post-merge)

on:
  push:
    branches: [master]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Skip the heavy job for PRs that don't carry the `ci:build` label.
    # Push-to-master and manual dispatch always run.
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            labels='${{ toJson(github.event.pull_request.labels) }}'
            if echo "$labels" | grep -q '"name":\s*"ci:build"'; then
              echo "run=true"  >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build-test:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    name: Build images and run sample_test
    runs-on: self-hosted
    timeout-minutes: 720
    env:
      MICAPIPE_BASE_IMAGE: ghcr.io/mica-mni/micapipe-base:latest
      MICAPIPE_MAIN_IMAGE: ghcr.io/mica-mni/micapipe:latest
      SIF_OUTPUT_PATH: /export03/data/enning/singularity/micapipe_v1_beta_ci.sif

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host context
        run: |
          set -e
          echo "Host: $(hostname)"
          echo "Working dir: $(pwd)"
          docker version || true
          singularity --version || true
          df -h /export03 || true

      - name: Build comprehensive base image (cached)
        run: |
          set -euo pipefail
          if docker image inspect "${MICAPIPE_BASE_IMAGE}" >/dev/null 2>&1; then
            echo "Base image present, skipping rebuild"
            docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep micapipe-base || true
          else
            echo "Building base image (this takes ~45-60 min)…"
            docker build -f Dockerfile.mamba-base -t "${MICAPIPE_BASE_IMAGE}" .
          fi

      - name: Build main image
        run: |
          set -euo pipefail
          docker build \
            -f Dockerfile.main \
            --build-arg "BASE_IMAGE=${MICAPIPE_BASE_IMAGE}" \
            -t "${MICAPIPE_MAIN_IMAGE}" \
            .

      - name: Build Singularity SIF
        env:
          MICAPIPE_DOCKER_TAG: latest
          MICAPIPE_DOCKER_IMAGE: ghcr.io/mica-mni/micapipe
          MICAPIPE_SIF_OUTPUT_PATH: ${{ env.SIF_OUTPUT_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SIF_OUTPUT_PATH}")"
          ./build_singularity.sh

      - name: Point sample_test at the freshly built SIF
        run: |
          set -euo pipefail
          sed -i "s|^container_img=.*|container_img=${SIF_OUTPUT_PATH}|" tests/sample_test.sh
          grep '^container_img=' tests/sample_test.sh

      - name: Run sample_test
        run: |
          set -euo pipefail
          chmod +x ./tests/sample_test.sh
          ./tests/sample_test.sh
