name: Build main image (fast code-only)

# Fast code-iteration CI. The heavy comprehensive base image is treated
# as a stable artifact — pulled from the registry, never rebuilt here.
# Only the slim Dockerfile.main layer (which copies micapipe code) is
# rebuilt, plus the Singularity SIF on top of it. Typical wall time: a
# few seconds to ~2 minutes once the base is on the runner.
#
# The slow base rebuild lives in build-base.yml and only fires when
# Dockerfile.mamba-base or micapipe_environment.yml actually change.
#
# sample_test.sh is gated by the `ci:build` PR label since a full run is
# multi-hour. Pull the label off again for routine code-only iteration.

on:
  push:
    branches: [master, v1, "enning/**"]
    # Skip when only docs / build-base / lint changed
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "Dockerfile.mamba-base"
      - "micapipe_environment.yml"
      - ".github/workflows/build-base.yml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "Dockerfile.mamba-base"
      - "micapipe_environment.yml"
      - ".github/workflows/build-base.yml"
      - ".github/workflows/lint.yml"
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-main:
    name: Build main image + SIF
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      MICAPIPE_BASE_IMAGE: ghcr.io/mica-mni/micapipe-comprehensive-base:latest
      MICAPIPE_MAIN_IMAGE: ghcr.io/mica-mni/micapipe:ci-${{ github.run_id }}
      MICAPIPE_MAIN_LATEST: ghcr.io/mica-mni/micapipe:latest
      SIF_OUTPUT_PATH: /export03/data/enning/singularity/micapipe_ci_${{ github.run_id }}.sif

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host context
        run: |
          set -e
          echo "Host: $(hostname)"
          echo "Working dir: $(pwd)"
          docker version --format '{{.Server.Version}}' 2>&1 | tail -1
          singularity --version
          df -h /export03

      - name: Ensure base image is present (pull, never build)
        run: |
          set -euo pipefail
          if docker image inspect "${MICAPIPE_BASE_IMAGE}" >/dev/null 2>&1; then
            echo "Base image already cached on this runner."
          else
            echo "Pulling ${MICAPIPE_BASE_IMAGE} from registry..."
            if ! docker pull "${MICAPIPE_BASE_IMAGE}"; then
              echo "::error::Base image not present locally and pull failed."
              echo "::error::This workflow does not rebuild the base image."
              echo "::error::Run the 'Build base image' workflow first, or push the base to the registry."
              exit 1
            fi
          fi
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep micapipe-comprehensive-base

      - name: Build slim main image (code-only layer)
        run: |
          set -euo pipefail
          time docker build \
            -f Dockerfile.main \
            --build-arg "BASE_IMAGE=${MICAPIPE_BASE_IMAGE}" \
            -t "${MICAPIPE_MAIN_IMAGE}" \
            -t "${MICAPIPE_MAIN_LATEST}" \
            .
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedAt}}' | grep "ghcr.io/mica-mni/micapipe " | head -3

      - name: Build Singularity SIF from local Docker image
        env:
          MICAPIPE_DOCKER_IMAGE: ghcr.io/mica-mni/micapipe
          MICAPIPE_DOCKER_TAG: ci-${{ github.run_id }}
          MICAPIPE_SIF_OUTPUT_PATH: ${{ env.SIF_OUTPUT_PATH }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${SIF_OUTPUT_PATH}")"
          time ./build_singularity.sh
          ls -lh "${SIF_OUTPUT_PATH}"

      - name: Smoke-test the SIF (--help only, fast)
        run: |
          set -euo pipefail
          singularity exec "${SIF_OUTPUT_PATH}" /opt/micapipe/micapipe -h | head -5

      - name: Decide whether to run sample_test
        id: decide_test
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            labels='${{ toJson(github.event.pull_request.labels) }}'
            if echo "$labels" | grep -q '"name":\s*"ci:build"'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point sample_test at the freshly built SIF
        if: steps.decide_test.outputs.run == 'true'
        run: |
          set -euo pipefail
          sed -i "s|^container_img=.*|container_img=${SIF_OUTPUT_PATH}|" tests/sample_test.sh
          grep '^container_img=' tests/sample_test.sh

      - name: Run sample_test (multi-hour; gated by ci:build label)
        if: steps.decide_test.outputs.run == 'true'
        timeout-minutes: 720
        run: |
          set -euo pipefail
          chmod +x ./tests/sample_test.sh
          ./tests/sample_test.sh

      - name: Cleanup CI image tag (keep :latest)
        if: always()
        run: |
          docker rmi "${MICAPIPE_MAIN_IMAGE}" 2>/dev/null || true
          rm -f "${SIF_OUTPUT_PATH}" 2>/dev/null || true
